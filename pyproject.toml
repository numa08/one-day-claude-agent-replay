[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-replay"
version = "0.1.0"
description = "Turn Claude Code session logs into a self-contained HTML replay"
requires-python = ">=3.9"
license = {text = "MIT"}
readme = "README.md"

[project.scripts]
agent-replay = "agent_replay.cli:main"

[tool.setuptools]
packages = ["agent_replay"]
